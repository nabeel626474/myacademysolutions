name: Android Release (signed)

# Builds a signed release APK + AAB for Play Store upload.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  - your .jks keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Create a keystore once on your machine and KEEP IT SAFE (Play Store requires
# the same key for every future update):
#   keytool -genkey -v -keystore my-academy.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias my-academy
#   base64 -w0 my-academy.jks   # paste the output into ANDROID_KEYSTORE_BASE64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: |
          npm run build || true
          # The Android shell loads the live site, so a minimal webDir is enough.
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><meta http-equiv="refresh" content="0;url=https://myacademysolutions.lovable.app">' > dist/index.html

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sign APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          OUT="$GITHUB_WORKSPACE/release"
          mkdir -p "$OUT"

          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$OUT/app-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT/my-academy-solutions-release.apk" \
            "$OUT/app-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT/my-academy-solutions-release.apk"
          rm "$OUT/app-release-aligned.apk"

          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          cp "$AAB" "$OUT/my-academy-solutions-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$OUT/my-academy-solutions-release.aab" "$KEY_ALIAS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*
